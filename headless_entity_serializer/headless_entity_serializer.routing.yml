headless_entity_serializer.settings_form:
  path: '/admin/config/headless-entity-serializer'
  defaults:
    _form: '\Drupal\headless_entity_serializer\Form\SettingsForm'
    _title: 'Entity Serialization Configuration'
  requirements:
    _permission: 'administer headless entity serializer'

headless_entity_serializer.tracking:
  path: '/admin/config/headless-entity-serializer/tracking'
  defaults:
    _controller: '\Drupal\headless_entity_serializer\Controller\TrackingController::listing'
    _title: 'Entity Change Tracking'
  requirements:
    _permission: 'administer headless entity serializer'
